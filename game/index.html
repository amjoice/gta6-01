<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porto Verde — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #101623;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: relative;
    width: 1280px;
    height: 800px;
    margin: 0 auto;
  }
  #game {
    display: block;
    width: 1280px;
    height: 800px;
    background: #7fae62;
  }
  #minimap {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 208px;
    height: 208px;
    border: 2px solid rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    background: #7fae62;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <canvas id="minimap" width="208" height="208"></canvas>
</div>
<script type="module">
  import { boot } from './src/main.js';
  boot();
</script>
</body>
</html>
